<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="container">
      <input type="checkbox" name="" id="toggle-btn">
      <!-- Left -->
      <aside class="left">
        <label for="toggle-btn" class="close"> <i class="fa-solid fa-xmark"></i></label>
        <ul>
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
          <li>Item 4</li>
        </ul>
      </aside>

      <!-- Right -->
      <div class="right">
        <!-- Navbar -->
        <nav>
        <label for="toggle-btn" class="open"><i class="fa-solid fa-bars"></i></label>
            <input type="search" />
          <p>Your face</p>
        </nav>

        <!-- Hero -->
        <div class="hero">
          <p>Hello User</p>
          <p>Recenet Items</p>
        </div>

        <!-- Cards -->
        <div class="cards">
          <div class="card-1">Card 1</div>
          <div class="card-2">Card 2</div>
          <div class="card-3">Card 3</div>
          <div class="card-4">Card 4</div>
        </div>

        <!-- Box 1 -->
        <div class="boxes">
          <div class="box-1 box">Box 1</div>
          <div class="box-bottom">
            <div class="box-2 box">Box 2</div>
            <div class="box-3 box">Box 3</div>
          </div>
        </div>

        
      </div>
    </div>
  </body>
</html>
